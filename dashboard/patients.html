<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Patients · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const renderTable = (patients) => {
  const tbody = document.getElementById('patients-table-body');
  if (!patients.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-secondary py-5">No patients matched the current search.</td></tr>`;
    return;
  }
  tbody.innerHTML = patients.map(patient => `
    <tr data-id="${patient.id}">
      <td>
        <div class="fw-semibold">${OITApp.escapeHtml(patient.name)}</div>
        <div class="text-secondary small">Created ${OITApp.formatDateTime(patient.created_at)}</div>
      </td>
      <td>${OITApp.escapeHtml(patient.mrn)}</td>
      <td>${OITApp.formatDate(patient.dob)}</td>
      <td>${OITApp.escapeHtml(patient.allergen)}</td>
      <td><span class="badge bg-blue-lt text-blue">${OITApp.escapeHtml(patient.currentDose)}</span></td>
      <td>${OITApp.formatDate(patient.nextUpdoseDate)}</td>
      <td>${OITApp.badge(patient.status)}</td>
    </tr>`).join('');
  tbody.querySelectorAll('tr').forEach(row => row.addEventListener('click', () => {
    window.location.href = `patient-detail.html?id=${row.dataset.id}`;
  }));
};

const renderMetrics = (patients) => {
  const active = patients.filter(patient => OITApp.statusTone(patient.status) === 'green').length;
  const warning = patients.filter(patient => OITApp.statusTone(patient.status) === 'yellow').length;
  const nextDates = patients.map(patient => patient.nextUpdoseDate).filter(Boolean).sort();
  document.getElementById('metrics-row').innerHTML = [
    OITApp.renderMetricCard({ label: 'Total patients', value: String(patients.length), icon: 'fa-user-group', color: 'blue', description: 'Visible in current search scope.' }),
    OITApp.renderMetricCard({ label: 'Active / stable', value: String(active), icon: 'fa-circle-check', color: 'green', description: 'Patients progressing on plan.' }),
    OITApp.renderMetricCard({ label: 'Need review', value: String(warning), icon: 'fa-triangle-exclamation', color: 'yellow', description: 'Observation or caution statuses.' }),
    OITApp.renderMetricCard({ label: 'Next updose', value: nextDates[0] ? OITApp.formatDate(nextDates[0]) : '—', icon: 'fa-calendar-days', color: 'blue', description: 'Earliest upcoming review date.' })
  ].join('');
};

OITApp.renderLayout({
  title: 'Patient roster',
  subtitle: 'Search by patient name, MRN, or date of birth.',
  activeNav: 'patients',
  content: `
    <div id="page-note"></div>
    <div class="row g-3 mb-3" id="metrics-row"></div>
    <div class="card mb-3">
      <div class="card-body">
        <div class="input-icon">
          <span class="input-icon-addon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="search" id="patient-search" class="form-control" placeholder="Search patients by name, MRN, or DOB">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="table-responsive">
        <table class="table table-vcenter table-clickable card-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>MRN</th>
              <th>DOB</th>
              <th>Allergen</th>
              <th>Current Dose</th>
              <th>Next Updose Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="patients-table-body"></tbody>
        </table>
      </div>
    </div>`
});

let source = await OITApp.resolveData(() => api.getPatients(''), () => OITApp.demoData.patients);
let patients = OITApp.asArray(source.data);
document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(source);
renderMetrics(patients);
renderTable(patients);

document.getElementById('patient-search').addEventListener('input', async (event) => {
  const value = event.target.value;
  const result = source.demo
    ? { data: OITApp.filterPatients(value), demo: true, error: source.error }
    : await OITApp.resolveData(() => api.getPatients(value), () => OITApp.filterPatients(value));
  source = result;
  patients = OITApp.asArray(result.data);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(result);
  renderMetrics(patients);
  renderTable(patients);
});

      });
      </script>
    </body>
    </html>
