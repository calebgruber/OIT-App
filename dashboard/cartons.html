<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Cartons · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Cartons & powder supplies',
  subtitle: 'Inventory oversight for open allergen supplies.',
  activeNav: 'cartons',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" id="status-filter"><option value="">All statuses</option><option>Open</option><option>Expiring Soon</option><option>Expired</option></select></div></div></div></div>
    <div class="row g-3">
      <div class="col-lg-7"><div class="card"><div class="card-header"><h3 class="card-title">Cartons</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Carton ID</th><th>Patient</th><th>Lot Number</th><th>Expiry</th><th>Date Opened</th><th>Status</th></tr></thead><tbody id="cartons-body"></tbody></table></div></div></div>
      <div class="col-lg-5"><div class="card"><div class="card-header"><h3 class="card-title">Powder supplies</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Supply</th><th>Remaining</th><th>Expiry</th><th>Status</th></tr></thead><tbody id="powder-body"></tbody></table></div></div></div>
    </div>`
});

const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const status = document.getElementById('status-filter').value;
  const [cartonsResult, powderResult] = await Promise.all([
    OITApp.resolveData(() => api.getCartons(patientId), () => OITApp.demoData.cartons.filter(item => (!patientId || item.patientId === patientId))),
    OITApp.resolveData(() => api.getPowderSupplies(patientId), () => OITApp.demoData.powderSupplies.filter(item => (!patientId || item.patientId === patientId)))
  ]);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote({ demo: cartonsResult.demo || powderResult.demo, error: cartonsResult.error || powderResult.error });
  const cartonItems = OITApp.asArray(cartonsResult.data).filter(item => !status || item.status === status);
  const powderItems = OITApp.asArray(powderResult.data);
  document.getElementById('cartons-body').innerHTML = cartonItems.map(item => `
    <tr>
      <td>${OITApp.escapeHtml(item.id)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.escapeHtml(item.lot)}</td>
      <td>${OITApp.formatDate(item.expiry)}</td>
      <td>${OITApp.formatDate(item.date_opened)}</td>
      <td>${OITApp.badge(item.status)}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-secondary py-4">No cartons matched the selected filters.</td></tr>';
  document.getElementById('powder-body').innerHTML = powderItems.map(item => `
    <tr>
      <td><div class="fw-semibold">${OITApp.escapeHtml(item.powder_type)}</div><div class="text-secondary small">${OITApp.escapeHtml(item.lot)}</div></td>
      <td>${item.remaining_grams} g</td>
      <td>${OITApp.formatDate(item.expiry)}</td>
      <td>${OITApp.badge(item.status)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No powder supply records found.</td></tr>';
};
['patient-filter', 'status-filter'].forEach(id => document.getElementById(id).addEventListener('change', render));
await render();

      });
      </script>
    </body>
    </html>
