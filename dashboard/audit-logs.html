<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Audit Logs · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

OITApp.renderLayout({
  title: 'Audit trail',
  subtitle: 'Read-only trace of user and system access patterns.',
  activeNav: 'audit-logs',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-2"><label class="form-label">User</label><input type="text" class="form-control" id="user-filter" placeholder="nurse.lewis"></div><div class="col-md-2"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions('')}</select></div><div class="col-md-2"><label class="form-label">Action</label><input type="text" class="form-control" id="action-filter" placeholder="Viewed"></div><div class="col-md-2"><label class="form-label">Entity</label><input type="text" class="form-control" id="entity-filter" placeholder="Patient"></div><div class="col-md-2"><label class="form-label">From</label><input type="date" class="form-control" id="date-from"></div><div class="col-md-2"><label class="form-label">To</label><input type="date" class="form-control" id="date-to"></div></div></div></div>
    <div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Timestamp</th><th>User</th><th>Patient</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id="audit-body"></tbody></table></div></div>`
});
const render = async () => {
  const filters = {
    user: document.getElementById('user-filter').value.trim(),
    patient_id: document.getElementById('patient-filter').value,
    action: document.getElementById('action-filter').value.trim(),
    entity: document.getElementById('entity-filter').value.trim(),
    date_from: document.getElementById('date-from').value,
    date_to: document.getElementById('date-to').value
  };
  const result = await OITApp.resolveData(
    () => api.getAuditLogs(filters),
    () => OITApp.demoData.auditLogs
  );
  let items = OITApp.asArray(result.data);
  if (filters.user) items = items.filter(item => item.user.toLowerCase().includes(filters.user.toLowerCase()));
  if (filters.patient_id) items = items.filter(item => item.patientId === filters.patient_id);
  if (filters.action) items = items.filter(item => item.action.toLowerCase().includes(filters.action.toLowerCase()));
  if (filters.entity) items = items.filter(item => item.entity.toLowerCase().includes(filters.entity.toLowerCase()));
  if (filters.date_from) items = items.filter(item => item.timestamp.slice(0, 10) >= filters.date_from);
  if (filters.date_to) items = items.filter(item => item.timestamp.slice(0, 10) <= filters.date_to);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(result);
  document.getElementById('audit-body').innerHTML = items.map(item => `
    <tr>
      <td>${OITApp.formatDateTime(item.timestamp)}</td>
      <td>${OITApp.escapeHtml(item.user)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.badge(item.action)}</td>
      <td>${OITApp.escapeHtml(item.entity)}</td>
      <td>${OITApp.escapeHtml(item.details)}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-secondary py-4">No audit events matched the selected filters.</td></tr>';
};
['user-filter', 'patient-filter', 'action-filter', 'entity-filter', 'date-from', 'date-to'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('user-filter').addEventListener('input', render);
document.getElementById('action-filter').addEventListener('input', render);
document.getElementById('entity-filter').addEventListener('input', render);
await render();

      });
      </script>
    </body>
    </html>
