<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Dose Plan · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Dose schedule',
  subtitle: 'Patient dose milestones and updose decisions.',
  activeNav: 'dose-plan',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div></div></div></div>
    <div class="row g-3">
      <div class="col-lg-7"><div class="card"><div class="card-header"><h3 class="card-title">Dose plan</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Date</th><th>Dose (mcg)</th><th>Form</th><th>Status</th></tr></thead><tbody id="dose-plan-body"></tbody></table></div></div></div>
      <div class="col-lg-5"><div class="card"><div class="card-header"><h3 class="card-title">Updose decisions</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Decision</th><th>Outcome</th><th>Clinician</th></tr></thead><tbody id="decisions-body"></tbody></table></div></div></div>
    </div>`
});

const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const dosePlanResult = patientId
    ? await OITApp.resolveData(() => api.getDosePlan(patientId), () => OITApp.demoData.dosePlans.filter(item => item.patientId === patientId))
    : { data: OITApp.demoData.dosePlans, demo: true, error: new Error('No patient selected; showing combined demo schedule.') };
  const decisionsResult = patientId
    ? await OITApp.resolveData(() => api.getUpdoseDecisions(patientId), () => OITApp.demoData.updoseDecisions.filter(item => item.patientId === patientId))
    : { data: OITApp.demoData.updoseDecisions, demo: true, error: new Error('No patient selected; showing combined demo decisions.') };
  const usesDemo = dosePlanResult.demo || decisionsResult.demo;
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote({ demo: usesDemo, error: dosePlanResult.error || decisionsResult.error });
  const rows = OITApp.asArray(dosePlanResult.data);
  document.getElementById('dose-plan-body').innerHTML = rows.map(item => `
    <tr>
      <td>${OITApp.formatDate(item.date)}</td>
      <td>${item.dose}</td>
      <td>${OITApp.escapeHtml(item.form)}</td>
      <td>${OITApp.badge(item.status)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No dose plan rows available.</td></tr>';
  document.getElementById('decisions-body').innerHTML = OITApp.asArray(decisionsResult.data).map(item => `
    <tr>
      <td><div class="fw-semibold">${OITApp.escapeHtml(item.current_dose)} → ${OITApp.escapeHtml(item.next_dose)}</div><div class="text-secondary small">${OITApp.formatDateTime(item.decided_at)}</div></td>
      <td>${OITApp.badge(item.outcome)}</td>
      <td>${OITApp.escapeHtml(item.clinician)}</td>
    </tr>`).join('') || '<tr><td colspan="3" class="text-center text-secondary py-4">No decisions found.</td></tr>';
};

document.getElementById('patient-filter').addEventListener('change', render);
await render();

      });
      </script>
    </body>
    </html>
