<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <title>OIT Management System</title>
</head>
<body>
  <div class="login-shell d-flex align-items-center justify-content-center p-3 p-md-4">
    <div class="card shadow-lg login-card">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-start mb-4">
          <div>
            <div class="badge bg-blue-lt text-blue mb-3">Clinical Access</div>
            <h1 class="h2 mb-1">OIT Management System</h1>
            <p class="text-secondary mb-0">Secure dashboard for patients, dosing, inventory, and clinical operations.</p>
          </div>
          <button class="btn btn-icon btn-ghost-secondary" type="button" id="settings-trigger" aria-label="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>
        </div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" autocomplete="username" placeholder="Enter your username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Enter your password" required>
          </div>
          <div id="login-error"></div>
          <div class="d-grid gap-2">
            <button class="btn btn-primary btn-lg" type="submit" id="login-button">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Sign in
            </button>
          </div>
        </form>
        <div class="mt-4 pt-3 border-top">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="text-secondary small">API endpoint: <span id="login-api-url"></span></div>
            <div class="text-secondary small">Demo access: <code>demo / demo</code> if API is unavailable.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="settings-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="settings-form">
          <div class="modal-header">
            <h5 class="modal-title">Configure API URL</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label class="form-label">API base URL</label>
            <input id="settings-api-url" type="url" class="form-control" placeholder="http://localhost:3000/api/v1" required>
            <div class="form-hint">Values like <code>http://localhost:3000</code> are normalized to <code>/api/v1</code>.</div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn me-auto" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const apiUrlLabel = document.getElementById('login-api-url');
      const renderApiUrl = () => {
        apiUrlLabel.textContent = localStorage.getItem('api_url') || 'http://localhost:3000/api/v1';
      };
      renderApiUrl();
      if (localStorage.getItem('auth_token')) {
        window.location.href = 'patients.html';
      }

      const settingsModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('settings-modal'));
      document.getElementById('settings-api-url').value = localStorage.getItem('api_url') || 'http://localhost:3000/api/v1';
      document.getElementById('settings-trigger').addEventListener('click', () => settingsModal.show());
      document.getElementById('settings-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const normalized = OITApp.saveApiUrl(document.getElementById('settings-api-url').value);
        renderApiUrl();
        document.getElementById('settings-api-url').value = normalized;
        settingsModal.hide();
      });

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('login-error');
        const button = document.getElementById('login-button');
        errorBox.innerHTML = '';
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in';

        try {
          await api.login(username, password);
          window.location.href = 'patients.html';
        } catch (error) {
          if (username === 'demo' && password === 'demo') {
            localStorage.setItem('auth_token', 'demo-token');
            localStorage.setItem('current_user', JSON.stringify({ name: 'Demo Clinician', username: 'demo', role: 'Clinical Staff' }));
            window.location.href = 'patients.html';
            return;
          }
          errorBox.innerHTML = `<div class="alert alert-danger" role="alert">${OITApp.escapeHtml(error.message || 'Login failed.')}</div>`;
        } finally {
          button.disabled = false;
          button.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Sign in';
        }
      });
    });
  </script>
</body>
</html>
