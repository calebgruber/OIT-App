<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Syringes · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Syringes & vials',
  subtitle: 'Read-only preparation status across scheduled doses.',
  activeNav: 'syringes',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" id="status-filter"><option value="">All statuses</option><option value="Ready">Ready</option><option value="Used">Used</option><option value="Expired">Expired</option><option value="Discarded">Discarded</option><option value="Expiring Soon">Expiring Soon</option></select></div></div></div></div>
    <div class="row g-3 mb-3" id="metrics-row"></div>
    <div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Syringe ID</th><th>Patient</th><th>Dose</th><th>Form</th><th>Date Drawn</th><th>Scheduled Date</th><th>Final Expiry</th><th>Status</th></tr></thead><tbody id="syringes-body"></tbody></table></div></div>`
});

const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const status = document.getElementById('status-filter').value;
  const result = await OITApp.resolveData(
    () => api.getSyringes(patientId, status),
    () => OITApp.demoData.syringes.filter(item => (!patientId || item.patientId === patientId) && (!status || item.status === status))
  );
  const items = OITApp.asArray(result.data);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(result);
  document.getElementById('metrics-row').innerHTML = [
    OITApp.renderMetricCard({ label: 'Visible syringes', value: String(items.length), icon: 'fa-prescription-bottle-medical', color: 'blue', description: 'Filtered clinical preparations.' }),
    OITApp.renderMetricCard({ label: 'Ready', value: String(items.filter(item => item.status === 'Ready').length), icon: 'fa-circle-check', color: 'green', description: 'Available for scheduled administration.' }),
    OITApp.renderMetricCard({ label: 'Expiring ≤24h', value: String(items.filter(item => OITApp.statusTone(item.status) === 'yellow').length), icon: 'fa-hourglass-half', color: 'yellow', description: 'Requires follow-up today.' }),
    OITApp.renderMetricCard({ label: 'Expired / critical', value: String(items.filter(item => OITApp.statusTone(item.status) === 'red').length), icon: 'fa-triangle-exclamation', color: 'red', description: 'Do not use for dosing.' })
  ].join('');
  document.getElementById('syringes-body').innerHTML = items.map(item => `
    <tr>
      <td>${OITApp.escapeHtml(item.id)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.escapeHtml(item.dose)}</td>
      <td>${OITApp.escapeHtml(item.form)}</td>
      <td>${OITApp.formatDateTime(item.date_drawn)}</td>
      <td>${OITApp.formatDateTime(item.scheduled_date)}</td>
      <td>${OITApp.formatDateTime(item.final_expiry)}</td>
      <td>${OITApp.expiryBadge(item.final_expiry, item.status)}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="text-center text-secondary py-4">No syringes matched the filters.</td></tr>';
};
['patient-filter', 'status-filter'].forEach(id => document.getElementById(id).addEventListener('change', render));
await render();

      });
      </script>
    </body>
    </html>
