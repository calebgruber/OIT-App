<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Symptom Logs · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Symptom logs',
  subtitle: 'Post-dose symptom surveillance and follow-up details.',
  activeNav: 'symptom-logs',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div></div></div></div>
    <div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Date / Time</th><th>Patient</th><th>Symptom</th><th>Severity</th><th>Timing</th><th>Notes</th><th>Created</th></tr></thead><tbody id="symptoms-body"></tbody></table></div></div>`
});
const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const result = await OITApp.resolveData(
    () => api.getSymptomLogs(patientId),
    () => OITApp.demoData.symptomLogs.filter(item => !patientId || item.patientId === patientId)
  );
  const items = OITApp.asArray(result.data);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(result);
  document.getElementById('symptoms-body').innerHTML = items.map(item => `
    <tr>
      <td>${OITApp.formatDateTime(item.date_time)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.escapeHtml(item.symptom)}</td>
      <td>${OITApp.badge(item.severity)}</td>
      <td>${OITApp.escapeHtml(item.timing)}</td>
      <td>${OITApp.escapeHtml(item.notes)}</td>
      <td>${OITApp.formatDateTime(item.created_at)}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="text-center text-secondary py-4">No symptom logs found.</td></tr>';
};
document.getElementById('patient-filter').addEventListener('change', render);
await render();

      });
      </script>
    </body>
    </html>
