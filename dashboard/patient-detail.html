<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <title>Patient Detail · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const patientId = OITApp.parseQuery().get('id') || OITApp.demoData.patients[0].id;
const patientResult = await OITApp.resolveData(() => api.getPatient(patientId), () => OITApp.getPatient(patientId));
const patient = patientResult.data || OITApp.demoData.patients[0];
const [dosePlanResult, decisionsResult, syringesResult, cartonsResult, marResult, foodLogsResult, symptomLogsResult, missionsResult, badgesResult] = await Promise.all([
  OITApp.resolveData(() => api.getDosePlan(patientId), () => OITApp.demoData.dosePlans.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getUpdoseDecisions(patientId), () => OITApp.demoData.updoseDecisions.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getSyringes(patientId), () => OITApp.demoData.syringes.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getCartons(patientId), () => OITApp.demoData.cartons.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getMAR(patientId), () => OITApp.demoData.mar.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getFoodLogs(patientId), () => OITApp.demoData.foodLogs.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getSymptomLogs(patientId), () => OITApp.demoData.symptomLogs.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getMissions(patientId), () => OITApp.demoData.missions.filter(item => item.patientId === patientId)),
  OITApp.resolveData(() => api.getBadges(patientId), () => OITApp.demoData.badges.filter(item => item.patientId === patientId))
]);
const dosePlan = OITApp.asArray(dosePlanResult.data);
const decisions = OITApp.asArray(decisionsResult.data);
const syringes = OITApp.asArray(syringesResult.data);
const cartons = OITApp.asArray(cartonsResult.data);
const marItems = OITApp.asArray(marResult.data);
const foodLogs = OITApp.asArray(foodLogsResult.data);
const symptomLogs = OITApp.asArray(symptomLogsResult.data);
const missions = OITApp.asArray(missionsResult.data);
const badges = OITApp.asArray(badgesResult.data);
const usesDemo = [patientResult, dosePlanResult, decisionsResult, syringesResult, cartonsResult, marResult, foodLogsResult, symptomLogsResult, missionsResult, badgesResult].some(result => result.demo);
const firstError = [patientResult, dosePlanResult, decisionsResult, syringesResult, cartonsResult, marResult, foodLogsResult, symptomLogsResult, missionsResult, badgesResult].find(result => result.error)?.error || null;

const tableRows = {
  dosePlan: dosePlan.map(item => `<tr><td>${OITApp.formatDate(item.date)}</td><td>${item.dose} mcg</td><td>${OITApp.escapeHtml(item.form)}</td><td>${OITApp.badge(item.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No dose plan entries.</td></tr>',
  syringes: syringes.map(item => `<tr><td>${OITApp.escapeHtml(item.id)}</td><td>${OITApp.escapeHtml(item.dose)}</td><td>${OITApp.escapeHtml(item.form)}</td><td>${OITApp.formatDateTime(item.final_expiry)}</td><td>${OITApp.expiryBadge(item.final_expiry, item.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-secondary py-4">No syringes assigned.</td></tr>',
  cartons: cartons.map(item => `<tr><td>${OITApp.escapeHtml(item.id)}</td><td>${OITApp.escapeHtml(item.lot)}</td><td>${OITApp.formatDate(item.expiry)}</td><td>${OITApp.formatDate(item.date_opened)}</td><td>${OITApp.badge(item.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-secondary py-4">No carton inventory available.</td></tr>',
  mar: marItems.map(item => `<tr><td>${OITApp.formatDateTime(item.date_time)}</td><td>${OITApp.escapeHtml(item.dose)}</td><td>${OITApp.escapeHtml(item.form)}</td><td>${OITApp.badge(item.outcome)}</td><td>${OITApp.escapeHtml(item.administered_by)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-secondary py-4">No MAR entries found.</td></tr>',
  foodLogs: foodLogs.map(item => `<tr><td>${OITApp.formatDateTime(item.date_time)}</td><td>${OITApp.escapeHtml(item.meal)}</td><td>${OITApp.badge(item.tolerated)}</td><td>${OITApp.escapeHtml(item.notes)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No food logs recorded.</td></tr>',
  symptomLogs: symptomLogs.map(item => `<tr><td>${OITApp.formatDateTime(item.date_time)}</td><td>${OITApp.escapeHtml(item.symptom)}</td><td>${OITApp.badge(item.severity)}</td><td>${OITApp.escapeHtml(item.notes)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No symptom logs recorded.</td></tr>',
  missions: missions.map(item => `<tr><td>${OITApp.escapeHtml(item.mission)}</td><td>${OITApp.formatDate(item.due_date)}</td><td>${item.points}</td><td>${OITApp.badge(item.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-secondary py-4">No missions found.</td></tr>'
};

OITApp.renderLayout({
  title: patient.name,
  subtitle: `${patient.mrn} • ${patient.allergen} protocol`,
  activeNav: 'patients',
  headerActions: `
    <div class="d-flex gap-2 flex-wrap">
      <a href="dose-plan.html?patient=${patient.id}" class="btn btn-primary"><i class="fa-solid fa-syringe me-2"></i>Open dose plan</a>
      <a href="mar.html?patient=${patient.id}" class="btn btn-outline-secondary"><i class="fa-solid fa-notes-medical me-2"></i>Review MAR</a>
    </div>`,
  content: `
    <div id="page-note"></div>
    <div class="row g-3 mb-3">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
              <div>
                <div class="text-secondary text-uppercase small fw-medium">Patient profile</div>
                <h3 class="mb-1">${OITApp.escapeHtml(patient.name)}</h3>
                <div class="text-secondary">MRN ${OITApp.escapeHtml(patient.mrn)} • DOB ${OITApp.formatDate(patient.dob)} • ${OITApp.escapeHtml(patient.protocol)}</div>
              </div>
              <div class="text-end">
                <div class="mb-2">${OITApp.badge(patient.status)}</div>
                <div class="badge bg-blue-lt text-blue">Current dose ${OITApp.escapeHtml(patient.currentDose)}</div>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-4"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small">Allergen</div><div class="fw-semibold mt-1">${OITApp.escapeHtml(patient.allergen)}</div></div></div>
              <div class="col-md-4"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small">Next updose date</div><div class="fw-semibold mt-1">${OITApp.formatDate(patient.nextUpdoseDate)}</div></div></div>
              <div class="col-md-4"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small">Chart created</div><div class="fw-semibold mt-1">${OITApp.formatDateTime(patient.created_at)}</div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-secondary text-uppercase small fw-medium mb-3">Latest updose decisions</div>
            <div class="timeline-mini">
              ${decisions.map(item => `<div class="timeline-mini-item"><div class="fw-semibold">${OITApp.escapeHtml(item.outcome)} to ${OITApp.escapeHtml(item.next_dose)}</div><div class="text-secondary small">${OITApp.formatDateTime(item.decided_at)} • ${OITApp.escapeHtml(item.clinician)}</div><div class="small mt-1">${OITApp.escapeHtml(item.notes)}</div></div>`).join('') || '<div class="text-secondary">No decisions recorded.</div>'}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs" data-bs-toggle="tabs" role="tablist">
          <li class="nav-item"><a href="#tabs-overview" class="nav-link active" data-bs-toggle="tab">Overview</a></li>
          <li class="nav-item"><a href="#tabs-dose-plan" class="nav-link" data-bs-toggle="tab">Dose Plan</a></li>
          <li class="nav-item"><a href="#tabs-syringes" class="nav-link" data-bs-toggle="tab">Syringes</a></li>
          <li class="nav-item"><a href="#tabs-cartons" class="nav-link" data-bs-toggle="tab">Cartons</a></li>
          <li class="nav-item"><a href="#tabs-mar" class="nav-link" data-bs-toggle="tab">MAR</a></li>
          <li class="nav-item"><a href="#tabs-food" class="nav-link" data-bs-toggle="tab">Food Logs</a></li>
          <li class="nav-item"><a href="#tabs-symptoms" class="nav-link" data-bs-toggle="tab">Symptom Logs</a></li>
          <li class="nav-item"><a href="#tabs-missions" class="nav-link" data-bs-toggle="tab">Missions</a></li>
        </ul>
      </div>
      <div class="card-body tab-content">
        <div class="tab-pane active show" id="tabs-overview">
          <div class="row g-3">
            <div class="col-lg-8">
              <div class="card border-0 shadow-none bg-transparent">
                <div class="card-body p-0">
                  <h3 class="card-title">Dose progression</h3>
                  <canvas id="doseChart" height="120"></canvas>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card border-0 bg-blue-lt text-blue">
                <div class="card-body">
                  <div class="text-uppercase small fw-medium mb-2">Clinical snapshot</div>
                  <div class="mb-2"><strong>${marItems.length}</strong> MAR entries logged</div>
                  <div class="mb-2"><strong>${foodLogs.length}</strong> meal checks documented</div>
                  <div><strong>${symptomLogs.length}</strong> symptom follow-ups on record</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-pane" id="tabs-dose-plan"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Date</th><th>Dose</th><th>Form</th><th>Status</th></tr></thead><tbody>${tableRows.dosePlan}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-syringes"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>ID</th><th>Dose</th><th>Form</th><th>Expiry</th><th>Status</th></tr></thead><tbody>${tableRows.syringes}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-cartons"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Carton ID</th><th>Lot</th><th>Expiry</th><th>Date Opened</th><th>Status</th></tr></thead><tbody>${tableRows.cartons}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-mar"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Date / Time</th><th>Dose</th><th>Form</th><th>Outcome</th><th>Administered By</th></tr></thead><tbody>${tableRows.mar}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-food"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Date / Time</th><th>Meal</th><th>Tolerated</th><th>Notes</th></tr></thead><tbody>${tableRows.foodLogs}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-symptoms"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Date / Time</th><th>Symptom</th><th>Severity</th><th>Notes</th></tr></thead><tbody>${tableRows.symptomLogs}</tbody></table></div></div>
        <div class="tab-pane" id="tabs-missions">
          <div class="row g-3">
            <div class="col-lg-7"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Mission</th><th>Due Date</th><th>Points</th><th>Status</th></tr></thead><tbody>${tableRows.missions}</tbody></table></div></div>
            <div class="col-lg-5"><div class="row g-3 badge-gallery">${badges.map(item => `<div class="col-sm-6"><div class="card"><div class="card-body text-center"><div class="icon-tile bg-${item.color}-lt text-${item.color} mx-auto mb-3"><i class="fa-solid ${item.icon}"></i></div><div class="fw-semibold">${OITApp.escapeHtml(item.name)}</div><div class="text-secondary small mt-1">${OITApp.escapeHtml(item.description)}</div><div class="small text-secondary mt-2">Earned ${OITApp.formatDate(item.earned_at)}</div></div></div></div>`).join('') || '<div class="col-12 text-secondary">No badges earned yet.</div>'}</div></div>
          </div>
        </div>
      </div>
    </div>`
});
document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote({ demo: usesDemo, error: firstError });
new Chart(document.getElementById('doseChart'), {
  type: 'line',
  data: {
    labels: dosePlan.map(item => OITApp.formatDate(item.date)),
    datasets: [{
      label: 'Dose (mcg)',
      data: dosePlan.map(item => item.dose),
      tension: 0.35,
      borderColor: '#206bc4',
      backgroundColor: 'rgba(32,107,196,.14)',
      fill: true,
      pointRadius: 4
    }]
  },
  options: {
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { y: { beginAtZero: true } }
  }
});

      });
      </script>
    </body>
    </html>
