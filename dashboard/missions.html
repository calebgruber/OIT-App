<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

      <title>Missions · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Missions & badges',
  subtitle: 'Engagement milestones and gamified adherence tracking.',
  activeNav: 'missions',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div><div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" id="date-filter"></div></div></div></div>
    <div class="row g-3">
      <div class="col-lg-7"><div class="card"><div class="card-header"><h3 class="card-title">Missions</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Mission</th><th>Patient</th><th>Due Date</th><th>Points</th><th>Status</th></tr></thead><tbody id="missions-body"></tbody></table></div></div></div>
      <div class="col-lg-5"><div class="card"><div class="card-header"><h3 class="card-title">Badges</h3></div><div class="card-body"><div class="row g-3 badge-gallery" id="badges-grid"></div></div></div></div>
    </div>`
});
const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const date = document.getElementById('date-filter').value;
  const [missionsResult, badgesResult] = await Promise.all([
    OITApp.resolveData(() => api.getMissions(patientId, date), () => OITApp.demoData.missions.filter(item => (!patientId || item.patientId === patientId) && (!date || item.due_date === date))),
    OITApp.resolveData(() => api.getBadges(patientId), () => OITApp.demoData.badges.filter(item => !patientId || item.patientId === patientId))
  ]);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote({ demo: missionsResult.demo || badgesResult.demo, error: missionsResult.error || badgesResult.error });
  const missions = OITApp.asArray(missionsResult.data);
  const badges = OITApp.asArray(badgesResult.data);
  document.getElementById('missions-body').innerHTML = missions.map(item => `
    <tr>
      <td>${OITApp.escapeHtml(item.mission)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.formatDate(item.due_date)}</td>
      <td>${item.points}</td>
      <td>${OITApp.badge(item.status)}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="text-center text-secondary py-4">No missions available for the selected criteria.</td></tr>';
  document.getElementById('badges-grid').innerHTML = badges.map(item => `
    <div class="col-sm-6">
      <div class="card">
        <div class="card-body text-center">
          <div class="icon-tile bg-${item.color}-lt text-${item.color} mx-auto mb-3"><i class="fa-solid ${item.icon}"></i></div>
          <div class="fw-semibold">${OITApp.escapeHtml(item.name)}</div>
          <div class="text-secondary small mt-1">${OITApp.escapeHtml(item.description)}</div>
          <div class="small text-secondary mt-2">${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))} • ${OITApp.formatDate(item.earned_at)}</div>
        </div>
      </div>
    </div>`).join('') || '<div class="col-12 text-secondary">No badges earned yet.</div>';
};
['patient-filter', 'date-filter'].forEach(id => document.getElementById(id).addEventListener('change', render));
await render();

      });
      </script>
    </body>
    </html>
