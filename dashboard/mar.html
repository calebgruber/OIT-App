<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <title>MAR · OIT Management</title>
    </head>
    <body>
      <div id="app-shell"></div>
      <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
      <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;

const initialPatient = OITApp.parseQuery().get('patient') || '';
OITApp.renderLayout({
  title: 'Medication administration records',
  subtitle: 'Dose administration outcomes and observation history.',
  activeNav: 'mar',
  content: `
    <div id="page-note"></div>
    <div class="card mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">Patient</label><select class="form-select" id="patient-filter">${OITApp.patientOptions(initialPatient)}</select></div><div class="col-md-3"><label class="form-label">From</label><input type="date" class="form-control" id="date-from"></div><div class="col-md-3"><label class="form-label">To</label><input type="date" class="form-control" id="date-to"></div><div class="col-md-3"><label class="form-label">Outcome</label><select class="form-select" id="outcome-filter"><option value="">All outcomes</option><option>Administered</option><option>Observed</option><option>Held</option></select></div></div></div></div>
    <div class="row g-3 mb-3"><div class="col-lg-8"><div class="row g-3" id="metrics-row"></div></div><div class="col-lg-4"><div class="card h-100"><div class="card-body"><div class="text-secondary text-uppercase small fw-medium mb-3">Outcome mix</div><canvas id="marChart" height="180"></canvas></div></div></div></div>
    <div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Date / Time</th><th>Patient</th><th>Dose</th><th>Form</th><th>Outcome</th><th>Administered By</th></tr></thead><tbody id="mar-body"></tbody></table></div></div>`
});

let marChart;
const render = async () => {
  const patientId = document.getElementById('patient-filter').value;
  const dateFrom = document.getElementById('date-from').value;
  const dateTo = document.getElementById('date-to').value;
  const outcome = document.getElementById('outcome-filter').value;
  const result = await OITApp.resolveData(
    () => api.getMAR(patientId, dateFrom, dateTo),
    () => OITApp.demoData.mar.filter(item => (!patientId || item.patientId === patientId))
  );
  let items = OITApp.asArray(result.data).filter(item => !outcome || item.outcome === outcome);
  if (dateFrom) items = items.filter(item => item.date_time.slice(0, 10) >= dateFrom);
  if (dateTo) items = items.filter(item => item.date_time.slice(0, 10) <= dateTo);
  document.getElementById('page-note').innerHTML = OITApp.renderDataSourceNote(result);
  document.getElementById('metrics-row').innerHTML = [
    OITApp.renderMetricCard({ label: 'Total doses', value: String(items.length), icon: 'fa-notes-medical', color: 'blue', description: 'Rows matching the current filters.' }),
    OITApp.renderMetricCard({ label: 'Administered', value: String(items.filter(item => item.outcome === 'Administered').length), icon: 'fa-circle-check', color: 'green', description: 'Successfully dosed visits.' }),
    OITApp.renderMetricCard({ label: 'Observed', value: String(items.filter(item => item.outcome === 'Observed').length), icon: 'fa-eye', color: 'yellow', description: 'Extended observation entries.' }),
    OITApp.renderMetricCard({ label: 'Held', value: String(items.filter(item => item.outcome === 'Held').length), icon: 'fa-pause-circle', color: 'red', description: 'Doses not administered.' })
  ].join('');
  document.getElementById('mar-body').innerHTML = items.map(item => `
    <tr>
      <td>${OITApp.formatDateTime(item.date_time)}</td>
      <td>${OITApp.escapeHtml(OITApp.getPatientName(item.patientId))}</td>
      <td>${OITApp.escapeHtml(item.dose)}</td>
      <td>${OITApp.escapeHtml(item.form)}</td>
      <td>${OITApp.badge(item.outcome)}</td>
      <td>${OITApp.escapeHtml(item.administered_by)}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-secondary py-4">No MAR records matched the selected filters.</td></tr>';
  const chartLabels = ['Administered', 'Observed', 'Held'];
  const chartValues = chartLabels.map(label => items.filter(item => item.outcome === label).length);
  marChart?.destroy();
  marChart = new Chart(document.getElementById('marChart'), {
    type: 'doughnut',
    data: { labels: chartLabels, datasets: [{ data: chartValues, backgroundColor: ['#2fb344', '#f59f00', '#d63939'] }] },
    options: { plugins: { legend: { position: 'bottom' } } }
  });
};
['patient-filter', 'date-from', 'date-to', 'outcome-filter'].forEach(id => document.getElementById(id).addEventListener('change', render));
await render();

      });
      </script>
    </body>
    </html>
